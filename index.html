  var canvas = document.getElementById('dlg-webgl-canvas');
  if (!canvas) return;
  var aspectRatio = 1920 / 1012;
  var applySize = function () {
    var viewportWidth = document.documentElement.clientWidth || window.innerWidth;
    var viewportHeight = document.documentElement.clientHeight || window.innerHeight;
    var width = Math.min(viewportWidth, viewportHeight * aspectRatio);
    var height = width / aspectRatio;
    document.documentElement.style.setProperty('--endless-canvas-width', Math.floor(width) + 'px');
    document.documentElement.style.setProperty('--endless-canvas-height', Math.floor(height) + 'px');
    canvas.style.border = '0';
    canvas.style.outline = '0';
  };
  applySize();
  window.addEventListener('resize', applySize);
})();
</script>
